name: Build Kernel Mojito NetHunter SukiSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Kernel
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison \
            gperf build-essential zip curl zlib1g-dev g++-multilib \
            libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev \
            squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool \
            make optipng bc libssl-dev rsync libncurses-dev libncurses5 python3

      - name: Download AOSP Clang and GCC Toolchains
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-11.0.0_r35/clang-r383902b.tar.gz
          mkdir clang && tar -xf clang-r383902b.tar.gz -C clang/
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

      - name: Integrate SukiSU and NetHunter Config
        run: |
          # 1. Bersihkan dan Clone source KSU langsung
          rm -rf drivers/kernelsu KernelSU-Next
          git clone -b next --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git drivers/kernelsu

          # 2. Sambungkan ke Makefile dan Kconfig drivers
          sed -i '/kernelsu/d' drivers/Makefile
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          sed -i '/kernelsu/d' drivers/Kconfig
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          # 3. Patch Hook Syscall Manual Resmi (exec.c, open.c, read_write.c, stat.c)

          # Patch fs/exec.c
          if ! grep -q "ksu_handle_execveat" fs/exec.c; then
            sed -i '/static int do_execveat_common/i \
          #ifdef CONFIG_KSU\
          extern bool ksu_execveat_hook __read_mostly;\
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\
          extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\
          #endif' fs/exec.c

            sed -i '/int flags)/{n;d}' fs/exec.c 2>/dev/null || true
            sed -i '/int flags)/a \
          {\
          #ifdef CONFIG_KSU\
          if (unlikely(ksu_execveat_hook))\
            ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\
          else\
            ksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);\
          #endif' fs/exec.c
          fi

          # Patch fs/open.c
          if ! grep -q "ksu_handle_faccessat" fs/open.c; then
            sed -i '/long do_faccessat(int dfd/i \
          #ifdef CONFIG_KSU\
          extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\
          #endif' fs/open.c

            sed -i '/unsigned int lookup_flags = LOOKUP_FOLLOW;/a \
          #ifdef CONFIG_KSU\
          ksu_handle_faccessat(&dfd, &filename, &mode, NULL);\
          #endif' fs/open.c
          fi

          # Patch fs/read_write.c
          if ! grep -q "ksu_handle_vfs_read" fs/read_write.c; then
            sed -i '/ssize_t vfs_read(struct file/i \
          #ifdef CONFIG_KSU\
          extern bool ksu_vfs_read_hook __read_mostly;\
          extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\
          #endif' fs/read_write.c

            sed -i '/ssize_t ret;/a \
          #ifdef CONFIG_KSU\
          if (unlikely(ksu_vfs_read_hook))\
            ksu_handle_vfs_read(&file, &buf, &count, &pos);\
          #endif' fs/read_write.c
          fi

          # Patch fs/stat.c
          if ! grep -q "ksu_handle_stat" fs/stat.c; then
            sed -i '/int vfs_statx(int dfd/i \
          #ifdef CONFIG_KSU\
          extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\
          #endif' fs/stat.c

            sed -i '/unsigned int lookup_flags = LOOKUP_FOLLOW/a \
          #ifdef CONFIG_KSU\
          ksu_handle_stat(&dfd, &filename, &flags);\
          #endif' fs/stat.c
          fi

          # 4. Tembakkan konfigurasi KSU dan NetHunter ke SEMUA defconfig
          find arch/arm64/configs/ -type f -name "*defconfig*" | while read -r def; do
            sed -i '/CONFIG_KSU/d' "$def"
            echo "CONFIG_KSU=y" >> "$def"
            sed -i 's/CONFIG_COMPAT_VDSO=y/# CONFIG_COMPAT_VDSO is not set/g' "$def"
            echo "CONFIG_COMPAT_VDSO=n" >> "$def"
            echo "CONFIG_PACKET=y" >> "$def"
            echo "CONFIG_NET_RAW=y" >> "$def"
            echo "CONFIG_TUN=y" >> "$def"
            echo "CONFIG_CFG80211=y" >> "$def"
            echo "CONFIG_NL80211_TESTMODE=y" >> "$def"
            echo "CONFIG_MAC80211=y" >> "$def"
            echo "CONFIG_USB_F_HID=y" >> "$def"
            echo "CONFIG_USB_CONFIGFS_F_HID=y" >> "$def"
            echo "CONFIG_ATH_CARDS=m" >> "$def"
            echo "CONFIG_ATH9K_HTC=m" >> "$def"
            echo "CONFIG_CARL9170=m" >> "$def"
            echo "CONFIG_RTL_CARDS=m" >> "$def"
            echo "CONFIG_RTL8187=m" >> "$def"
            echo "CONFIG_RT2X00=m" >> "$def"
            echo "CONFIG_RT2800USB=m" >> "$def"
          done

      - name: Compile Kernel and Modules
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CROSS_COMPILE_COMPAT=arm-linux-androideabi-

          mkdir -p out
          make O=out ARCH=arm64 mojito_defconfig

          # Paksa aktifkan kembali di file target .config
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_COMPAT_VDSO=n" >> out/.config
          make O=out ARCH=arm64 olddefconfig

          echo "=== VALIDASI KSU DI .CONFIG ==="
          grep "CONFIG_KSU" out/.config
          echo "==============================="

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CROSS_COMPILE_COMPAT=arm-linux-androideabi-

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CROSS_COMPILE_COMPAT=arm-linux-androideabi- \
            modules

      - name: Generate DTB and dtbo
        run: |
          wget -q https://android.googlesource.com/platform/system/libufdt/+archive/master/utils.tar.gz
          tar -xf utils.tar.gz
          python3 src/mkdtboimg.py create out/arch/arm64/boot/dtbo.img --page_size=4096 $(find out/arch/arm64/boot/dts/ -name "*.dtbo") || true

          mkdir -p out/dtb_final
          find out/arch/arm64/boot/dts/qcom/ -name "*sm6150*.dtb" -o -name "*mojito*.dtb" -o -name "*sunny*.dtb" | sort | while read -r file; do
            cat "$file" >> out/dtb_final/dtb
          done

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $GITHUB_WORKSPACE/AnyKernel3
          cd $GITHUB_WORKSPACE/AnyKernel3

          cat << 'AKEOF' > anykernel.sh
          properties() { '
          kernel.string=Kernel NetHunter SukiSU Mojito
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=mojito
          device.name2=sunny
          supported.versions=11 - 14
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          ui_print " ";
          ui_print "Flashing Kernel NetHunter SukiSU...";

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          flash_dtb;

          if [ -f dtbo.img ]; then
            flash_dtbo;
          fi

          ui_print "Kernel berhasil dipasang!";
          AKEOF

          sed -i 's/^[ \t]*//' anykernel.sh

          cp $GITHUB_WORKSPACE/out/arch/arm64/boot/Image .
          [ -f "$GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img" ] && cp $GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img .
          [ -f "$GITHUB_WORKSPACE/out/dtb_final/dtb" ] && cp $GITHUB_WORKSPACE/out/dtb_final/dtb .

          mkdir -p modules/vendor/lib/modules
          find $GITHUB_WORKSPACE/out/ -name "*.ko" -exec cp {} modules/vendor/lib/modules/ \; 2>/dev/null || true

          zip -r9 NetHunter-SukiSU-Mojito.zip * -x .git README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-SukiSU-Mojito
          path: AnyKernel3/NetHunter-SukiSU-Mojito.zip
