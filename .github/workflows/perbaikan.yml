name: Build Kernel Mojito SukiSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup True SukiSU
        run: |
          # 1. Clone source resmi SukiSU langsung ke drivers/kernelsu
          rm -rf drivers/kernelsu
          git clone --depth=1 https://github.com/ShirkNeko/KernelSU-Next.git drivers/kernelsu || \
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git drivers/kernelsu

          # 2. Paksa Makefile drivers memuat kernelsu
          sed -i '/drivers\/kernelsu\//d' drivers/Makefile
          echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile

          # 3. Paksa Kconfig drivers memuat kernelsu
          if ! grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig; then
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi

          # 4. Patch Hook Syscall Manual (Wajib 4.14)
          if ! grep -q "ksu_handle_execve" fs/exec.c; then
            sed -i '/setup_new_exec(bprm);/a \
          #ifdef CONFIG_KSU\
          extern int ksu_handle_execve(int *fd, const char __user **filename, const char __user *const __user **argv, const char __user *const __user **envp);\
          ksu_handle_execve(&fd, &filename, &argv, &envp);\
          #endif' fs/exec.c
          fi

          if ! grep -q "ksu_handle_faccessat" fs/open.c; then
            sed -i '/SYSCALL_DEFINE3(faccessat/a \
          #ifdef CONFIG_KSU\
          extern int ksu_handle_faccessat(int *dfd, const char __user **filename, int *mode, int *flags);\
          ksu_handle_faccessat(&dfd, &filename, &mode, &flags);\
          #endif' fs/open.c
          fi

          if ! grep -q "ksu_handle_vfs_read" fs/read_write.c; then
            sed -i '/ssize_t vfs_read(struct file/a \
          #ifdef CONFIG_KSU\
          extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\
          ksu_handle_vfs_read(&file, &buf, &count, &pos);\
          #endif' fs/read_write.c
          fi

          # 5. Aktifkan di mojito_defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/mojito_defconfig
