name: Build Kernel Mojito NetHunter SukiSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Kernel
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison \
            gperf build-essential zip curl zlib1g-dev g++-multilib \
            libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev \
            squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool \
            make optipng bc libssl-dev rsync libncurses-dev libncurses5 python3

      - name: Download AOSP Clang and GCC Toolchains
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-11.0.0_r35/clang-r383902b.tar.gz
          mkdir clang && tar -xf clang-r383902b.tar.gz -C clang/
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

      - name: Integrate SukiSU and NetHunter Config
        run: |
          # 1. Bersihkan modul KSU lama jika ada
          rm -rf drivers/kernelsu KernelSU KernelSU-Next

          # 2. Clone KernelSU-Next resmi dan buat Symlink absolut
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU
          ln -sf $GITHUB_WORKSPACE/KernelSU/kernel drivers/kernelsu

          # Fix syscall_fn_t untuk kernel 4.14
          if [ -f KernelSU/kernel/hook/syscall_hook.h ]; then
            sed -i '1i #include <linux/syscalls.h>\ntypedef long (*syscall_fn_t)(const struct pt_regs *);' KernelSU/kernel/hook/syscall_hook.h
          fi

          # Sambungkan ke drivers Makefile dan Kconfig
          sed -i '/kernelsu/d' drivers/Makefile
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          sed -i '/kernelsu/d' drivers/Kconfig
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          # 3. Patch Hook Syscall Manual Presisi via Python
          python3 - << 'PYEOF'
          # --- 1. fs/exec.c ---
          with open("fs/exec.c", "r") as f:
              content = f.read()

          if "ksu_handle_execveat" not in content:
              hook_decl = (
                  "\n#ifdef CONFIG_KSU\n"
                  "extern bool ksu_execveat_hook __read_mostly;\n"
                  "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n"
                  "extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n"
                  "#endif\n"
              )
              hook_call = (
                  "{\n"
                  "#ifdef CONFIG_KSU\n"
                  "\tif (unlikely(ksu_execveat_hook))\n"
                  "\t\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n"
                  "\telse\n"
                  "\t\tksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);\n"
                  "#endif\n"
              )
              content = content.replace("static int do_execveat_common(", hook_decl + "static int do_execveat_common(")
              target = "static int do_execveat_common(int fd, struct filename *filename,\n\t\t\t      struct user_arg_ptr argv,\n\t\t\t      struct user_arg_ptr envp,\n\t\t\t      int flags)\n{"
              if target in content:
                  content = content.replace(target, target[:-1] + hook_call)
          with open("fs/exec.c", "w") as f:
              f.write(content)

          # --- 2. fs/open.c ---
          with open("fs/open.c", "r") as f:
              content = f.read()

          if "ksu_handle_faccessat" not in content:
              hook_decl = (
                  "\n#ifdef CONFIG_KSU\n"
                  "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n"
                  "#endif\n"
              )
              hook_call = (
                  "\tunsigned int lookup_flags = LOOKUP_FOLLOW;\n"
                  "#ifdef CONFIG_KSU\n"
                  "\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n"
                  "#endif\n"
              )
              content = content.replace("long do_faccessat(int dfd, const char __user *filename, int mode)\n{",
                                        hook_decl + "long do_faccessat(int dfd, const char __user *filename, int mode)\n{")
              idx = content.find("long do_faccessat")
              if idx != -1:
                  part_before = content[:idx]
                  part_after = content[idx:]
                  part_after = part_after.replace("\tunsigned int lookup_flags = LOOKUP_FOLLOW;\n", hook_call, 1)
                  content = part_before + part_after

          with open("fs/open.c", "w") as f:
              f.write(content)

          # --- 3. fs/read_write.c ---
          with open("fs/read_write.c", "r") as f:
              content = f.read()

          if "ksu_handle_vfs_read" not in content:
              hook_decl = (
                  "\n#ifdef CONFIG_KSU\n"
                  "extern bool ksu_vfs_read_hook __read_mostly;\n"
                  "extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\n"
                  "#endif\n"
              )
              hook_call = (
                  "\tssize_t ret;\n\n"
                  "#ifdef CONFIG_KSU\n"
                  "\tif (unlikely(ksu_vfs_read_hook))\n"
                  "\t\tksu_handle_vfs_read(&file, &buf, &count, &pos);\n"
                  "#endif\n"
              )
              content = content.replace("ssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)\n{",
                                        hook_decl + "ssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)\n{")
              idx = content.find("ssize_t vfs_read(struct file *file")
              if idx != -1:
                  part_before = content[:idx]
                  part_after = content[idx:]
                  part_after = part_after.replace("\tssize_t ret;\n", hook_call, 1)
                  content = part_before + part_after

          with open("fs/read_write.c", "w") as f:
              f.write(content)

          # --- 4. fs/stat.c ---
          with open("fs/stat.c", "r") as f:
              content = f.read()

          if "ksu_handle_stat" not in content:
              hook_decl = (
                  "\n#ifdef CONFIG_KSU\n"
                  "extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n"
                  "#endif\n"
              )
              hook_call = (
                  "\tunsigned int lookup_flags = LOOKUP_FOLLOW | LOOKUP_AUTOMOUNT;\n\n"
                  "#ifdef CONFIG_KSU\n"
                  "\tksu_handle_stat(&dfd, &filename, &flags);\n"
                  "#endif\n"
              )
              content = content.replace("int vfs_statx(int dfd, const char __user *filename, int flags,",
                                        hook_decl + "int vfs_statx(int dfd, const char __user *filename, int flags,")
              idx = content.find("int vfs_statx(int dfd")
              if idx != -1:
                  part_before = content[:idx]
                  part_after = content[idx:]
                  part_after = part_after.replace("\tunsigned int lookup_flags = LOOKUP_FOLLOW | LOOKUP_AUTOMOUNT;\n", hook_call, 1)
                  content = part_before + part_after

          with open("fs/stat.c", "w") as f:
              f.write(content)

          print("Semua Patch Syscall KSU Berhasil Diterapkan!")
          PYEOF

          # 4. Tembakkan konfigurasi KSU dan NetHunter ke SEMUA defconfig
          find arch/arm64/configs/ -type f -name "*defconfig*" | while read -r def; do
            sed -i '/CONFIG_KSU/d' "$def"
            sed -i '/CONFIG_KPROBES/d' "$def"
            sed -i '/CONFIG_HAVE_KPROBES/d' "$def"
            sed -i '/CONFIG_KPROBE_EVENTS/d' "$def"
            sed -i '/CONFIG_OVERLAY_FS/d' "$def"
            echo "CONFIG_KPROBES=y" >> "$def"
            echo "CONFIG_HAVE_KPROBES=y" >> "$def"
            echo "CONFIG_KPROBE_EVENTS=y" >> "$def"
            echo "CONFIG_OVERLAY_FS=y" >> "$def"
            echo "CONFIG_KSU=y" >> "$def"
            sed -i 's/CONFIG_COMPAT_VDSO=y/# CONFIG_COMPAT_VDSO is not set/g' "$def"
            echo "CONFIG_COMPAT_VDSO=n" >> "$def"
            echo "CONFIG_PACKET=y" >> "$def"
            echo "CONFIG_NET_RAW=y" >> "$def"
            echo "CONFIG_TUN=y" >> "$def"
            echo "CONFIG_CFG80211=y" >> "$def"
            echo "CONFIG_NL80211_TESTMODE=y" >> "$def"
            echo "CONFIG_MAC80211=y" >> "$def"
            echo "CONFIG_USB_F_HID=y" >> "$def"
            echo "CONFIG_USB_CONFIGFS_F_HID=y" >> "$def"
            echo "CONFIG_ATH_CARDS=m" >> "$def"
            echo "CONFIG_ATH9K_HTC=m" >> "$def"
            echo "CONFIG_CARL9170=m" >> "$def"
            echo "CONFIG_RTL_CARDS=m" >> "$def"
            echo "CONFIG_RTL8187=m" >> "$def"
            echo "CONFIG_RT2X00=m" >> "$def"
            echo "CONFIG_RT2800USB=m" >> "$def"
          done

      - name: Compile Kernel and Modules
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CROSS_COMPILE_COMPAT=arm-linux-androideabi-

          mkdir -p out
          make O=out ARCH=arm64 mojito_defconfig

          # Paksa aktifkan dependensi dan KSU di .config
          echo "CONFIG_KPROBES=y" >> out/.config
          echo "CONFIG_HAVE_KPROBES=y" >> out/.config
          echo "CONFIG_KPROBE_EVENTS=y" >> out/.config
          echo "CONFIG_OVERLAY_FS=y" >> out/.config
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_COMPAT_VDSO=n" >> out/.config
          make O=out ARCH=arm64 olddefconfig

          echo "=== VALIDASI KSU DI .CONFIG ==="
          grep "CONFIG_KSU" out/.config || echo "KSU belum terpilih atau dinonaktifkan Kconfig"
          echo "==============================="

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CROSS_COMPILE_COMPAT=arm-linux-androideabi-

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CROSS_COMPILE_COMPAT=arm-linux-androideabi- \
            modules

      - name: Generate DTB and dtbo
        run: |
          wget -q https://android.googlesource.com/platform/system/libufdt/+archive/master/utils.tar.gz
          tar -xf utils.tar.gz
          python3 src/mkdtboimg.py create out/arch/arm64/boot/dtbo.img --page_size=4096 $(find out/arch/arm64/boot/dts/ -name "*.dtbo") || true

          mkdir -p out/dtb_final
          find out/arch/arm64/boot/dts/qcom/ -name "*sm6150*.dtb" -o -name "*mojito*.dtb" -o -name "*sunny*.dtb" | sort | while read -r file; do
            cat "$file" >> out/dtb_final/dtb
          done

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $GITHUB_WORKSPACE/AnyKernel3
          cd $GITHUB_WORKSPACE/AnyKernel3

          cat << 'AKEOF' > anykernel.sh
          properties() { '
          kernel.string=Kernel NetHunter SukiSU Mojito
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=mojito
          device.name2=sunny
          supported.versions=11 - 14
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          ui_print " ";
          ui_print "Flashing Kernel NetHunter SukiSU...";

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          flash_dtb;

          if [ -f dtbo.img ]; then
            flash_dtbo;
          fi

          ui_print "Kernel berhasil dipasang!";
          AKEOF

          sed -i 's/^[ \t]*//' anykernel.sh

          cp $GITHUB_WORKSPACE/out/arch/arm64/boot/Image .
          [ -f "$GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img" ] && cp $GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img .
          [ -f "$GITHUB_WORKSPACE/out/dtb_final/dtb" ] && cp $GITHUB_WORKSPACE/out/dtb_final/dtb .

          mkdir -p modules/vendor/lib/modules
          find $GITHUB_WORKSPACE/out/ -name "*.ko" -exec cp {} modules/vendor/lib/modules/ \; 2>/dev/null || true

          zip -r9 NetHunter-SukiSU-Mojito.zip * -x .git README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-SukiSU-Mojito
          path: AnyKernel3/NetHunter-SukiSU-Mojito.zip
