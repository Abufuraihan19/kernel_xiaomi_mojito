name: Build Kernel Mojito NetHunter DroidSpaces Full

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Kernel
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache flex bison build-essential bc libssl-dev \
            libncurses5-dev libncurses5 rsync python3 git zip curl lzop patch

      - name: Setup Compiler Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-
          save-always: true

      - name: Download AOSP Clang and GCC Toolchains
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-11.0.0_r35/clang-r383902b.tar.gz
          mkdir clang && tar -xf clang-r383902b.tar.gz -C clang/
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

      - name: Clean Residual KernelSU If Present
        run: |
          # Bersihkan residu KSU agar kernel murni tanpa conflict hook
          rm -rf drivers/kernelsu KernelSU KernelSU-Next
          sed -i '/kernelsu/d' drivers/Makefile 2>/dev/null || true
          sed -i '/kernelsu/d' drivers/Kconfig 2>/dev/null || true
          git checkout fs/exec.c fs/open.c fs/read_write.c fs/stat.c drivers/Makefile drivers/Kconfig 2>/dev/null || true

      - name: Apply DroidSpaces Non-GKI Patches (Step 3)
        run: |
          echo "=== Menerapkan Patch DroidSpaces Mandiri (Non-GKI 4.14) ==="

          # Patch 1: Mengaktifkan clone unprivileged user namespace
          cat << 'EOF' > /tmp/0001-droidspaces-userns.patch
          --- a/kernel/user_namespace.c
          +++ b/kernel/user_namespace.c
          @@ -21,6 +21,7 @@
           #include <linux/sort.h>
           
           static struct kmem_cache *user_ns_cachep __read_mostly;
          +bool unprivileged_userns_clone = 1;
           
           static bool new_idmap_permitted(const struct file *file,
           		struct user_namespace *ns, int cap_setid,
          EOF

          # Patch 2: NetParanoid Bypass langsung di kernel socket
          cat << 'EOF' > /tmp/0002-droidspaces-net.patch
          --- a/net/socket.c
          +++ b/net/socket.c
          @@ -95,6 +95,9 @@
           #include <net/sock.h>
           #include <linux/netfilter.h>
           
          +#if defined(CONFIG_ANDROID_PARANOID_NETWORK)
          +#undef CONFIG_ANDROID_PARANOID_NETWORK
          +#endif
           
           static int sock_no_open(struct inode *irrelevant, struct file *dontcare);
           static ssize_t sock_aio_read(struct kiocb *iocb, const struct iovec *iov,
          EOF

          for p in /tmp/*.patch; do
            if [ -f "$p" ]; then
              echo "Mencoba menerapkan: $(basename "$p")"
              patch -p1 --forward --batch < "$p" 2>/dev/null || echo "Info: Lewati patch $(basename "$p") (sudah kompatibel / tidak diperlukan)"
            fi
          done

      - name: Inject NetHunter and Full DroidSpaces Config (Step 1 & 2)
        run: |
          find arch/arm64/configs/ -type f -name "*defconfig*" | while read -r def; do
            # Hapus residu KSU dari defconfig
            sed -i '/CONFIG_KSU/d' "$def"

            # Matikan VDSO 32-bit compat (Solusi permanen error objcopy)
            sed -i 's/CONFIG_COMPAT_VDSO=y/# CONFIG_COMPAT_VDSO is not set/g' "$def"
            echo "CONFIG_COMPAT_VDSO=n" >> "$def"

            # NetHunter Wireless & HID
            echo "CONFIG_PACKET=y" >> "$def"
            echo "CONFIG_NET_RAW=y" >> "$def"
            echo "CONFIG_TUN=y" >> "$def"
            echo "CONFIG_CFG80211=y" >> "$def"
            echo "CONFIG_NL80211_TESTMODE=y" >> "$def"
            echo "CONFIG_MAC80211=y" >> "$def"
            echo "CONFIG_USB_F_HID=y" >> "$def"
            echo "CONFIG_USB_CONFIGFS_F_HID=y" >> "$def"
            echo "CONFIG_ATH_CARDS=m" >> "$def"
            echo "CONFIG_ATH9K_HTC=m" >> "$def"
            echo "CONFIG_CARL9170=m" >> "$def"
            echo "CONFIG_RTL_CARDS=m" >> "$def"
            echo "CONFIG_RTL8187=m" >> "$def"
            echo "CONFIG_RT2X00=m" >> "$def"
            echo "CONFIG_RT2800USB=m" >> "$def"

            # === DroidSpaces Step 1: Core Namespaces, Cgroups & Networking ===
            echo "CONFIG_SYSCTL=y" >> "$def"
            echo "CONFIG_SYSVIPC=y" >> "$def"
            echo "CONFIG_POSIX_MQUEUE=y" >> "$def"
            echo "CONFIG_NAMESPACES=y" >> "$def"
            echo "CONFIG_PID_NS=y" >> "$def"
            echo "CONFIG_UTS_NS=y" >> "$def"
            echo "CONFIG_IPC_NS=y" >> "$def"
            echo "CONFIG_USER_NS=y" >> "$def"
            echo "CONFIG_NET_NS=y" >> "$def"
            echo "CONFIG_SECCOMP=y" >> "$def"
            echo "CONFIG_SECCOMP_FILTER=y" >> "$def"
            echo "CONFIG_CGROUPS=y" >> "$def"
            echo "CONFIG_CGROUP_DEVICE=y" >> "$def"
            echo "CONFIG_CGROUP_SCHED=y" >> "$def"
            echo "CONFIG_FAIR_GROUP_SCHED=y" >> "$def"
            echo "CONFIG_CGROUP_FREEZER=y" >> "$def"
            echo "CONFIG_CGROUP_NET_PRIO=y" >> "$def"
            echo "CONFIG_MEMCG=y" >> "$def"
            echo "CONFIG_CFS_BANDWIDTH=y" >> "$def"
            echo "CONFIG_CGROUP_PIDS=y" >> "$def"
            echo "CONFIG_CGROUP_CPUACCT=y" >> "$def"
            echo "CONFIG_DEVTMPFS=y" >> "$def"
            echo "CONFIG_OVERLAY_FS=y" >> "$def"
            echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$def"
            echo "CONFIG_TMPFS_XATTR=y" >> "$def"
            echo "CONFIG_FW_LOADER=y" >> "$def"
            echo "CONFIG_FW_LOADER_USER_HELPER=y" >> "$def"
            echo "CONFIG_FW_LOADER_COMPRESS=y" >> "$def"
            echo "CONFIG_VETH=y" >> "$def"
            echo "CONFIG_BRIDGE=y" >> "$def"
            echo "CONFIG_NETFILTER=y" >> "$def"
            echo "CONFIG_BRIDGE_NETFILTER=y" >> "$def"
            echo "CONFIG_NETFILTER_ADVANCED=y" >> "$def"
            echo "CONFIG_NF_CONNTRACK=y" >> "$def"
            echo "CONFIG_IP_NF_IPTABLES=y" >> "$def"
            echo "CONFIG_IP_NF_FILTER=y" >> "$def"
            echo "CONFIG_NF_NAT=y" >> "$def"
            echo "CONFIG_NF_TABLES=y" >> "$def"
            echo "CONFIG_IP_NF_TARGET_MASQUERADE=y" >> "$def"
            echo "CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y" >> "$def"
            echo "CONFIG_NETFILTER_XT_TARGET_TCPMSS=y" >> "$def"
            echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> "$def"
            echo "CONFIG_NF_CONNTRACK_NETLINK=y" >> "$def"
            echo "CONFIG_NF_NAT_REDIRECT=y" >> "$def"
            echo "CONFIG_IP_ADVANCED_ROUTER=y" >> "$def"
            echo "CONFIG_IP_MULTIPLE_TABLES=y" >> "$def"
            echo "CONFIG_NF_CONNTRACK_IPV4=y" >> "$def"
            echo "CONFIG_NF_NAT_IPV4=y" >> "$def"
            echo "CONFIG_IP_NF_NAT=y" >> "$def"
            echo "CONFIG_IPV6=y" >> "$def"
            echo "CONFIG_IPV6_MULTIPLE_TABLES=y" >> "$def"
            echo "CONFIG_IP6_NF_IPTABLES=y" >> "$def"
            echo "CONFIG_IP6_NF_FILTER=y" >> "$def"
            echo "CONFIG_IP6_NF_MANGLE=y" >> "$def"
            echo "CONFIG_IP6_NF_NAT=y" >> "$def"
            echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y" >> "$def"
            echo "CONFIG_NF_CONNTRACK_IPV6=y" >> "$def"
            echo "CONFIG_NF_NAT_IPV6=y" >> "$def"
            echo "CONFIG_MACVLAN=y" >> "$def"

            # Nonaktifkan Paranoid Network
            sed -i 's/CONFIG_ANDROID_PARANOID_NETWORK=y/# CONFIG_ANDROID_PARANOID_NETWORK is not set/g' "$def"
            echo "CONFIG_ANDROID_PARANOID_NETWORK=n" >> "$def"

            # === DroidSpaces Step 2: Firewall / UFW / Fail2ban Support ===
            echo "CONFIG_NETFILTER_XT_MATCH_COMMENT=y" >> "$def"
            echo "CONFIG_NETFILTER_XT_MATCH_STATE=y" >> "$def"
            echo "CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y" >> "$def"
            echo "CONFIG_NETFILTER_XT_MATCH_MULTIPORT=y" >> "$def"
            echo "CONFIG_NETFILTER_XT_MATCH_HL=y" >> "$def"
            echo "CONFIG_NETFILTER_XT_TARGET_REJECT=y" >> "$def"
            echo "CONFIG_IP_NF_TARGET_REJECT=y" >> "$def"
            echo "CONFIG_NETFILTER_XT_TARGET_LOG=y" >> "$def"
            echo "CONFIG_IP_NF_TARGET_ULOG=y" >> "$def"
            echo "CONFIG_NETFILTER_XT_MATCH_RECENT=y" >> "$def"
            echo "CONFIG_NETFILTER_XT_MATCH_LIMIT=y" >> "$def"
            echo "CONFIG_NETFILTER_XT_MATCH_HASHLIMIT=y" >> "$def"
            echo "CONFIG_NETFILTER_XT_MATCH_OWNER=y" >> "$def"
            echo "CONFIG_NETFILTER_XT_MATCH_PKTTYPE=y" >> "$def"
            echo "CONFIG_NETFILTER_XT_MATCH_MARK=y" >> "$def"
            echo "CONFIG_NETFILTER_XT_TARGET_MARK=y" >> "$def"
            echo "CONFIG_IP_SET=y" >> "$def"
            echo "CONFIG_IP_SET_HASH_IP=y" >> "$def"
            echo "CONFIG_IP_SET_HASH_NET=y" >> "$def"
            echo "CONFIG_NETFILTER_XT_SET=y" >> "$def"
            echo "CONFIG_NETFILTER_NETLINK_QUEUE=y" >> "$def"
            echo "CONFIG_NETFILTER_NETLINK_LOG=y" >> "$def"
            echo "CONFIG_NETFILTER_XT_TARGET_NFLOG=y" >> "$def"
          done

      - name: Compile Kernel and Modules
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC="ccache clang"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CROSS_COMPILE_COMPAT=arm-linux-androideabi-

          ccache -M 5G

          mkdir -p out
          make O=out ARCH=arm64 mojito_defconfig

          # Paksa matikan VDSO 32 secara mutlak dan pastikan config DroidSpaces aktif
          sed -i 's/CONFIG_COMPAT_VDSO=y/# CONFIG_COMPAT_VDSO is not set/g' out/.config
          cat << 'EOF' >> out/.config
          CONFIG_COMPAT_VDSO=n
          CONFIG_NAMESPACES=y
          CONFIG_USER_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_OVERLAY_FS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_ANDROID_PARANOID_NETWORK=n
          EOF

          make O=out ARCH=arm64 olddefconfig

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CROSS_COMPILE_COMPAT=arm-linux-androideabi-

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CROSS_COMPILE_COMPAT=arm-linux-androideabi- \
            modules

          ccache -s

      - name: Generate DTB and dtbo
        run: |
          wget -q https://android.googlesource.com/platform/system/libufdt/+archive/master/utils.tar.gz
          tar -xf utils.tar.gz
          python3 src/mkdtboimg.py create out/arch/arm64/boot/dtbo.img --page_size=4096 $(find out/arch/arm64/boot/dts/ -name "*.dtbo") || true

          mkdir -p out/dtb_final
          find out/arch/arm64/boot/dts/qcom/ -name "*sm6150*.dtb" -o -name "*mojito*.dtb" -o -name "*sunny*.dtb" | sort | while read -r file; do
            cat "$file" >> out/dtb_final/dtb
          done

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $GITHUB_WORKSPACE/AnyKernel3
          cd $GITHUB_WORKSPACE/AnyKernel3

          cat << 'AKEOF' > anykernel.sh
          properties() { '
          kernel.string=Kernel NetHunter DroidSpaces Mojito
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=mojito
          device.name2=sunny
          supported.versions=11 - 14
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          ui_print " ";
          ui_print "Flashing Kernel NetHunter + DroidSpaces Full...";

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          flash_dtb;

          if [ -f dtbo.img ]; then
            flash_dtbo;
          fi

          ui_print "Kernel berhasil dipasang!";
          AKEOF

          sed -i 's/^[ \t]*//' anykernel.sh

          cp $GITHUB_WORKSPACE/out/arch/arm64/boot/Image .
          [ -f "$GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img" ] && cp $GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img .
          [ -f "$GITHUB_WORKSPACE/out/dtb_final/dtb" ] && cp $GITHUB_WORKSPACE/out/dtb_final/dtb .

          mkdir -p modules/vendor/lib/modules
          find $GITHUB_WORKSPACE/out/ -name "*.ko" -exec cp {} modules/vendor/lib/modules/ \; 2>/dev/null || true

          zip -r9 NetHunter-DroidSpaces-Mojito.zip * -x .git README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-DroidSpaces-Mojito
          path: AnyKernel3/NetHunter-DroidSpaces-Mojito.zip
