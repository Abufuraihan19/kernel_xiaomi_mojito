name: Build Kernel Mojito NetHunter SukiSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Kernel
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison \
            gperf build-essential zip curl zlib1g-dev g++-multilib \
            libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev \
            squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool \
            make optipng bc libssl-dev rsync libncurses-dev libncurses5

      - name: Download AOSP Clang and GCC Toolchains
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-11.0.0_r35/clang-r383902b.tar.gz
          mkdir clang && tar -xf clang-r383902b.tar.gz -C clang/
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

      - name: Setup KernelSU-Next and NetHunter Drivers
        run: |
          # 1. Integrasi KernelSU-Next
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next-susfs || \
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

          # 2. Fix VDSO32 Bug
          sed -i 's/CONFIG_COMPAT_VDSO=y/# CONFIG_COMPAT_VDSO is not set/g' arch/arm64/configs/mojito_defconfig
          echo "CONFIG_COMPAT_VDSO=n" >> arch/arm64/configs/mojito_defconfig

          # 3. Kebutuhan Dasar NetHunter (Packet Injection, TAP/TUN, Mac80211)
          echo "CONFIG_PACKET=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_NET_RAW=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_TUN=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_CFG80211=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_NL80211_TESTMODE=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_CFG80211_DEVELOPER_WARNINGS=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_MAC80211=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_MAC80211_MESH=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_WLAN=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_WIRELESS_EXT=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_WEXT_CORE=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_WEXT_PROC=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_WEXT_SPY=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_WEXT_PRIV=y" >> arch/arm64/configs/mojito_defconfig

          # 4. Driver Atheros (ath9k_htc, carl9170, ar9170)
          echo "CONFIG_ATH_CARDS=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_ATH9K_HTC=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_ATH9K_HTC_DEBUGFS=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_CARL9170=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_CARL9170_DEBUGFS=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_CARL9170_WPC=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_ATH9K_COMMON=y" >> arch/arm64/configs/mojito_defconfig

          # 5. Driver Realtek (rtl8187, rtl8xxxu, r8188eu)
          echo "CONFIG_RTL_CARDS=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_RTL8187=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_RTL8187_LEDS=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_RTL8XXXU=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_RTL8XXXU_UNTESTED=y" >> arch/arm64/configs/mojito_defconfig

          # 6. Driver MediaTek / Ralink (rt2800usb, mt7601u)
          echo "CONFIG_RT2X00=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_RT2500USB=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_RT73USB=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_RT2800USB=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_RT2800USB_RT33XX=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_RT2800USB_RT35XX=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_RT2800USB_RT3573=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_RT2800USB_RT53XX=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_RT2800USB_RT55XX=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_RT2800USB_UNKNOWN=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_MT7601U=y" >> arch/arm64/configs/mojito_defconfig

          # 7. USB Bluetooth Dongle
          echo "CONFIG_BT_HCIBTUSB=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_BT_HCIBTUSB_BCM=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_BT_HCIBTUSB_RTL=y" >> arch/arm64/configs/mojito_defconfig

          # 8. NetHunter BadUSB & Keyboard HID Gadget
          echo "CONFIG_USB_F_HID=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_USB_CONFIGFS_F_HID=y" >> arch/arm64/configs/mojito_defconfig

      - name: Download and Pre-configure AnyKernel3 for Mojito
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $GITHUB_WORKSPACE/AnyKernel3
          cd $GITHUB_WORKSPACE/AnyKernel3
          sed -i 's/kernel.string=.*/kernel.string=Kernel SukiSU NetHunter Mojito/g' anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=1/g' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=mojito/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=sunny/g' anykernel.sh
          sed -i 's/block=.*/block=\/dev\/block\/bootdevice\/by-name\/boot/g' anykernel.sh
          sed -i 's/is_slot_device=.*/is_slot_device=0/g' anykernel.sh

      - name: Compile Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CROSS_COMPILE_COMPAT=arm-linux-androideabi-

          mkdir -p out
          make O=out ARCH=arm64 mojito_defconfig
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CROSS_COMPILE_COMPAT=arm-linux-androideabi-

      - name: Package Flashable Zip
        run: |
          cd $GITHUB_WORKSPACE/AnyKernel3
          if [ -f "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb .
          elif [ -f "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" ]; then
            cp $GITHUB_WORKSPACE/out/arch/arm64/boot/Image .
          fi

          mkdir -p modules/vendor/lib/modules
          find $GITHUB_WORKSPACE/out/ -name "*.ko" -exec cp {} modules/vendor/lib/modules/ \; 2>/dev/null || true
          mkdir -p dtb
          find $GITHUB_WORKSPACE/out/arch/arm64/boot/dts/ -name "*.dtb" -exec cp {} ./dtb/ \; 2>/dev/null || true
          zip -r9 NetHunter-SukiSU-Mojito.zip * -x .git README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-SukiSU-Mojito-Flashable
          path: AnyKernel3/NetHunter-SukiSU-Mojito.zip