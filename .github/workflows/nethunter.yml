cat << 'EOF' > compile.yml
name: Build Kernel Mojito NetHunter SukiSU (Split Structure)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Kernel
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison \
            gperf build-essential zip curl zlib1g-dev g++-multilib \
            libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev \
            squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool \
            make optipng bc libssl-dev rsync libncurses-dev libncurses5 python3

      - name: Download AOSP Clang and GCC Toolchains
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-11.0.0_r35/clang-r383902b.tar.gz
          mkdir clang && tar -xf clang-r383902b.tar.gz -C clang/
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

      - name: Setup KernelSU-Next and NetHunter Config
        run: |
          # 1. Integrasi KernelSU-Next
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next-susfs || \
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

          # 2. Fix VDSO32 Bug
          sed -i 's/CONFIG_COMPAT_VDSO=y/# CONFIG_COMPAT_VDSO is not set/g' arch/arm64/configs/mojito_defconfig
          echo "CONFIG_COMPAT_VDSO=n" >> arch/arm64/configs/mojito_defconfig

          # 3. Core NetHunter (Built-in)
          echo "CONFIG_PACKET=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_NET_RAW=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_TUN=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_CFG80211=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_NL80211_TESTMODE=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_MAC80211=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_MAC80211_MESH=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_WLAN=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_WIRELESS_EXT=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_WEXT_CORE=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_WEXT_PROC=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_WEXT_SPY=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_WEXT_PRIV=y" >> arch/arm64/configs/mojito_defconfig

          # 4. Driver External Wi-Fi (Wajib =m agar tidak bentrok dengan simbol Qualcomm)
          echo "CONFIG_ATH_CARDS=m" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_ATH9K_HTC=m" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_ATH9K_HTC_DEBUGFS=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_CARL9170=m" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_ATH9K_COMMON=m" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_RTL_CARDS=m" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_RTL8187=m" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_RT2X00=m" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_RT2800USB=m" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_USB_F_HID=y" >> arch/arm64/configs/mojito_defconfig
          echo "CONFIG_USB_CONFIGFS_F_HID=y" >> arch/arm64/configs/mojito_defconfig

      - name: Compile Kernel and Modules
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"
          export ARCH=arm
